name: Android CI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建并上传的 tag（如 v1.6.2）'
        required: true
        default: 'v1.6.2'

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - name: Resolve release tag and version
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ inputs.tag }}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building tag=$TAG version=$VERSION"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ steps.resolve.outputs.tag }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleNormalRelease -P "version=${{ steps.resolve.outputs.VERSION }}"

      # 使用 build-tools 自带 apksigner 为 normal flavor 的 ABI 拆分 release APK 签名
      # 产物: universal(全架构兜底) + arm64-v8a + armeabi-v7a
      - name: Sign release APKs
        id: sign
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          BT_DIR=$(ls -d "$SDK_ROOT"/build-tools/* | sort -V | tail -n 1)
          echo "Using build-tools: $BT_DIR"

          # 还原密钥库
          echo "${ANDROID_SIGNING_KEY}" | base64 -d > "$RUNNER_TEMP/sesame-m-release.jks"

          mkdir -p "$RUNNER_TEMP/signed"
          # 签名 normal release 目录下的全部 ABI 拆分 APK
          for APK_FILE in app/build/outputs/apk/normal/release/*.apk; do
            [ -e "$APK_FILE" ] || { echo "No APK found in app/build/outputs/apk/normal/release"; exit 1; }
            APK_NAME=$(basename "$APK_FILE")
            echo "Signing $APK_NAME"

            "$BT_DIR/zipalign" -f 4 "$APK_FILE" "$RUNNER_TEMP/aligned.apk"
            "$BT_DIR/apksigner" sign \
              --ks "$RUNNER_TEMP/sesame-m-release.jks" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass "pass:${ANDROID_KEYSTORE_PASSWORD}" \
              --key-pass "pass:${ANDROID_KEY_PASSWORD}" \
              --out "$RUNNER_TEMP/signed/$APK_NAME" \
              "$RUNNER_TEMP/aligned.apk"
          done

      - name: Stage signed APKs into workspace
        run: |
          mkdir -p release-signed
          cp "$RUNNER_TEMP"/signed/*.apk release-signed/
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          for f in release-signed/*.apk; do
            sha256sum "$f" > "$f.sha256"
          done

      # 更新日志放在仓库里的 UTF-8 文件里，CI 只做拼接：
      # 之前是在本地用 PowerShell 拼字符串再提交，中文被按非 UTF-8 编码发出去，全变成了问号
      - name: Compose release notes
        run: |
          set -euo pipefail
          TAG="${{ steps.resolve.outputs.tag }}"
          NOTES="docs/release-notes/${TAG}.md"
          {
            if [ -f "$NOTES" ]; then cat "$NOTES"; fi
            echo
            cat docs/release-notes/download.md
          } > release-notes.md
          echo "Composed release-notes.md ($(wc -c < release-notes.md) bytes)"

      - name: Upload signed assets to Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.resolve.outputs.tag }}
          files: release-signed/*
          tag_name: ${{ steps.resolve.outputs.tag }}
          draft: false
          # 正文由本工作流从仓库里的 UTF-8 文件拼出来并整体覆盖：
          # 追加（append_body）会让人工预置的正文与 CI 拼出来的正文重复
          append_body: false
          generate_release_notes: true
          body_path: release-notes.md
